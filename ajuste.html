<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajuste manual — Recibo Producto Terminado</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .combo-wrap { position: relative; }
  .combo-list {
    display: none; position: absolute; top: 44px; left: 0; right: 0;
    background: #fff; border: 1px solid var(--borde); border-radius: 12px;
    max-height: 220px; overflow-y: auto; z-index: 20;
    box-shadow: 0 8px 22px rgba(26,26,26,0.18);
  }
  .combo-list div { padding: 10px 14px; font-size: 14px; cursor: pointer; }
  .combo-list div:hover { background: var(--fondo); }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a href="home.html" class="back">‹</a>
    <div>
      <h1>Ajuste manual</h1>
      <p class="sub">Inventario activo</p>
    </div>
  </header>
  <main>
    <div class="card">
      <label>Ítem</label>
      <div class="combo-wrap">
        <input type="text" id="item-input" placeholder="Buscar ítem..." autocomplete="off">
        <div class="combo-list" id="item-list"></div>
      </div>

      <label>Tipo de ajuste</label>
      <select id="tipo-select">
        <option value="Entrada">Entrada</option>
        <option value="Salida">Salida</option>
        <option value="Correccion">Corrección</option>
      </select>

      <label>Cantidad</label>
      <input type="number" id="cantidad-input">

      <label>Motivo</label>
      <textarea id="motivo-input"></textarea>

      <div class="error-msg" id="errorMsg"></div>
      <div class="info-msg" id="okMsg" style="display:none;">Ajuste registrado correctamente.</div>

      <button class="btn btn-primary" id="btn-registrar" style="margin-top:6px;">Registrar ajuste</button>
    </div>

    <div id="historial-ajustes"></div>
  </main>
</div>
<script src="js/app.js"></script>
<script>
const usuario = requiereApp();
let maestros = { items: [] };
let itemCodigoSel = "";
let itemDescripcionSel = "";

async function init() {
  if (!usuario) return;
  try { maestros = await apiGet("getMaestros", {}); } catch (err) { mostrarError("errorMsg", err.message); }
}
init();

const itemInput = document.getElementById("item-input");
const itemList = document.getElementById("item-list");

function renderItemList(filtro) {
  const texto = filtro.trim().toLowerCase();
  if (!texto) { itemList.style.display = "none"; return; }
  const matches = (maestros.items || []).filter(it => {
    const codigo = String(it.codigo || "").toLowerCase();
    const descripcion = String(it.descripcion || "").toLowerCase();
    return codigo.includes(texto) || descripcion.includes(texto);
  });
  itemList.innerHTML = "";
  matches.slice(0, 50).forEach(it => {
    const codigo = String(it.codigo || "");
    const label = `${codigo} — ${it.descripcion || ""}`;
    const row = document.createElement("div");
    row.textContent = label;
    row.onclick = () => {
      itemCodigoSel = codigo;
      itemLabelSel = label;
      itemInput.value = label;
      itemList.style.display = "none";
    };
    itemList.appendChild(row);
  });
  itemList.style.display = matches.length ? "block" : "none";
}
let itemLabelSel = "";
itemInput.addEventListener("input", () => {
  if (itemInput.value !== itemLabelSel) itemCodigoSel = "";
  renderItemList(itemInput.value);
});
itemInput.addEventListener("focus", () => renderItemList(itemInput.value));
itemInput.addEventListener("blur", () => {
  setTimeout(() => {
    if (itemCodigoSel) return;
    const texto = itemInput.value.trim();
    if (!texto) return;
    const exacto = (maestros.items || []).find(it => {
      const codigo = String(it.codigo || "");
      const label = `${codigo} — ${it.descripcion || ""}`;
      return codigo.toLowerCase() === texto.toLowerCase() || label.toLowerCase() === texto.toLowerCase();
    });
    if (exacto) {
      const codigo = String(exacto.codigo || "");
      itemCodigoSel = codigo;
      itemLabelSel = `${codigo} — ${exacto.descripcion || ""}`;
      itemInput.value = itemLabelSel;
    }
  }, 150);
});
document.addEventListener("click", (e) => {
  if (!itemInput.contains(e.target) && !itemList.contains(e.target)) itemList.style.display = "none";
});

document.getElementById("btn-registrar").addEventListener("click", async () => {
  ocultarError("errorMsg");
  document.getElementById("okMsg").style.display = "none";

  const tipo = document.getElementById("tipo-select").value;
  const cantidad = document.getElementById("cantidad-input").value;
  const motivo = document.getElementById("motivo-input").value.trim();

  if (!itemCodigoSel) return mostrarError("errorMsg", "Selecciona un ítem");
  if (!cantidad || Number(cantidad) <= 0) return mostrarError("errorMsg", "Ingresa la cantidad");
  if (!motivo) return mostrarError("errorMsg", "Ingresa el motivo del ajuste");

  const btn = document.getElementById("btn-registrar");
  btn.disabled = true;
  try {
    await apiPost("ajusteInventario", { item: itemLabelSel, tipo, cantidad: Number(cantidad), motivo, usuario: usuario.nombre });
    document.getElementById("okMsg").style.display = "block";
    document.getElementById("cantidad-input").value = "";
    document.getElementById("motivo-input").value = "";
    cargarHistorialAjustes();
  } catch (err) {
    mostrarError("errorMsg", err.message);
  } finally {
    btn.disabled = false;
  }
});

async function cargarHistorialAjustes() {
  const cont = document.getElementById("historial-ajustes");
  try {
    const res = await apiGet("getAjustes", {}, { silencioso: true });
    const ajustes = (res.ajustes || []).slice(0, 15);
    cont.innerHTML = "";
    if (!ajustes.length) return;
    cont.innerHTML = '<label style="font-size:13px;font-weight:700;color:var(--gris);text-transform:uppercase;margin:20px 0 10px;display:block;">Últimos ajustes registrados</label>';
    ajustes.forEach(a => {
      const item = document.createElement("div");
      item.className = "req-item";
      item.innerHTML = `
        <div class="fila">
          <span class="reqid">${a.Item}</span>
          <span class="badge badge-Pendiente">${a.Tipo}</span>
        </div>
        <p class="op">Cantidad: ${a.Cantidad} · ${a.Fecha_Hora}</p>
        <p class="op">${a.Motivo || ""}</p>
        <p class="op">Registrado por ${a.Usuario || "—"}</p>`;
      cont.appendChild(item);
    });
  } catch (err) { /* silencioso */ }
}
cargarHistorialAjustes();
</script>
</body>
</html>
