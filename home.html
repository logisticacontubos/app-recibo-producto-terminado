<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio — Recibo Producto Terminado</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .section-title { font-size: 13px; font-weight: 700; color: var(--gris); margin: 26px 0 10px; text-transform: uppercase; letter-spacing: .04em; }
  .opn-card { margin-bottom: 12px; }
  .opn-card .encabezado { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
  .opn-card .encabezado .opnid { font-size: 16px; font-weight: 700; }
  .opn-card .meta { font-size: 12px; color: var(--gris); margin: 0 0 12px; }
  .entrega-linea {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-top: 1px solid var(--borde); cursor: pointer;
  }
  .entrega-linea:hover .item-txt { color: var(--magenta); }
  .entrega-linea .item-txt { font-size: 13px; font-weight: 500; }
  .entrega-linea .sub { font-size: 12px; color: var(--gris); margin-top: 2px; }
  .badge-editado { background: var(--magenta-claro); color: #72243E; margin-left: 6px; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <h1>Recibo Producto Terminado</h1>
      <p class="sub">Producción → Bodega</p>
    </div>
  </header>
  <main>
    <div id="acciones"></div>

    <div id="lista-opn"></div>
    <div id="lista-novedades"></div>
  </main>
</div>
<script src="js/app.js"></script>
<script>
const usuario = requiereApp();
const rol = usuario ? usuario.rol : null;
const esVistaRecibir = usuario && (puedeRecibir(rol) || esAdmin(rol));
const esVistaProduccionSolo = usuario && puedeCrearEntrega(rol) && !esVistaRecibir;

if (usuario) {
  const cont = document.getElementById("acciones");

  if (puedeCrearEntrega(rol) || esAdmin(rol)) {
    cont.appendChild(accion("📦", "Nueva entrega", "Registrar producto que produce entrega a bodega", "crear-entrega.html"));
  }
  if (esVistaRecibir) {
    cont.appendChild(accion("📥", "Recibir entrega", "Buscar y confirmar entregas pendientes", "bodega.html"));
  }
  cont.appendChild(accion("🕘", "Historial", "Entregas completadas, filtros y reportes", "historial.html"));
  cont.appendChild(accion("🏷️", "OPN sin entrada a SIESA", "Recibidas en bodega, pendientes de registrar", "siesa.html"));
  cont.appendChild(accion("📋", "OPN abiertas", "Órdenes con despachos parciales pendientes", "opn-abiertas.html"));
  if (esAdmin(rol)) {
    cont.appendChild(accion("📊", "Inventario activo", "Ver saldo disponible por ítem", "inventario.html"));
    cont.appendChild(accion("✏️", "Ajuste manual", "Registrar entradas, salidas o correcciones", "ajuste.html"));
    cont.appendChild(accion("📈", "Indicadores", "Resumen de entregas y calidad", "indicadores.html"));
  }

  cargarResumen();
}

function accion(icono, titulo, sub, href) {
  const a = document.createElement("a");
  a.className = "accion";
  a.href = href;
  a.innerHTML = `<span class="icono">${icono}</span><span><div>${titulo}</div><div class="sub">${sub}</div></span>`;
  return a;
}

async function cargarResumen() {
  const contOpn = document.getElementById("lista-opn");
  const contNov = document.getElementById("lista-novedades");
  try {
    const res = await apiGet("getEntregas", {}, { silencioso: true });
    const entregas = res.entregas || [];

    let pendientes = entregas.filter(en => en.Estado === "No entregado");
    let tituloSeccion = "Órdenes activas / pendientes";
    let esClicableEditar = false;

    if (esVistaProduccionSolo) {
      // Producción (sin permiso de recibir): solo ve y puede editar lo que ELLA creó.
      pendientes = pendientes.filter(en => en.Creado_Por === usuario.nombre);
      tituloSeccion = "Mis entregas pendientes (toca para editar)";
      esClicableEditar = true;
    }

    const porOpn = {};
    pendientes.forEach(en => {
      if (!porOpn[en.OPN]) porOpn[en.OPN] = { entregas: [], info: en };
      porOpn[en.OPN].entregas.push(en);
    });

    contOpn.innerHTML = "";
    const opns = Object.keys(porOpn);
    if (opns.length) {
      contOpn.innerHTML = `<p class="section-title">${tituloSeccion}</p>`;
      opns.forEach(opn => {
        const grupo = porOpn[opn];
        const info = grupo.info;
        const card = document.createElement("div");
        card.className = "card opn-card";
        card.innerHTML = `
          <div class="encabezado">
            <span class="opnid">${opn}</span>
            <span class="badge badge-Pendiente">${grupo.entregas.length} pendiente${grupo.entregas.length > 1 ? "s" : ""}</span>
          </div>
          <p class="meta">${info.Cliente || "Cliente sin definir"} · Creado por ${info.OPN_Creado_Por || info.Creado_Por || "—"} · ${info.OPN_Fecha_Creacion || info.Fecha_Creacion || "—"}</p>`;
        grupo.entregas.forEach(en => {
          const linea = document.createElement("div");
          linea.className = "entrega-linea";
          const editadoTag = String(en.Editado).toUpperCase() === "SI" ? `<span class="badge badge-editado">Editado</span>` : "";
          linea.innerHTML = `
            <div>
              <div class="item-txt">${en.Item} ${editadoTag}</div>
              <div class="sub">${en.Cantidad_Anunciada} und · Producción: ${en.Fecha_Produccion}</div>
            </div>
            <span style="color:var(--gris);font-size:18px;">›</span>`;
          if (esClicableEditar) {
            linea.onclick = () => { window.location.href = `editar-entrega.html?id=${encodeURIComponent(en.ID_Entrega)}`; };
          } else if (esVistaRecibir) {
            linea.onclick = () => { window.location.href = `bodega.html?id=${encodeURIComponent(en.ID_Entrega)}`; };
          } else {
            linea.style.cursor = "default";
          }
          card.appendChild(linea);
        });
        contOpn.appendChild(card);
      });
    }

    // Recibidas con novedad recientes (menor/mayor cantidad) — visibles para todos.
    const novedades = entregas
      .filter(en => en.Estado === "Recibido con menor cantidad" || en.Estado === "Recibido con mayor cantidad")
      .sort((a, b) => String(b.Fecha_Recibido).localeCompare(String(a.Fecha_Recibido)))
      .slice(0, 10);

    contNov.innerHTML = "";
    if (novedades.length) {
      contNov.innerHTML = '<p class="section-title">Recibidas con novedad recientes</p>';
      novedades.forEach(en => {
        const badgeClass = "badge-" + claseEstado(en.Estado);
        const item = document.createElement("div");
        item.className = "req-item";
        item.innerHTML = `
          <div class="fila">
            <span class="reqid">${en.OPN}</span>
            <span class="badge ${badgeClass}">${en.Estado}</span>
          </div>
          <p class="op">${en.Cliente ? en.Cliente + " · " : ""}${en.Item}</p>
          <p class="op">Anunciado ${en.Cantidad_Anunciada} · Recibido ${en.Cantidad_Fisica_Recibida} · ${en.Fecha_Recibido || "—"}</p>`;
        contNov.appendChild(item);
      });
    }
  } catch (err) {
    contOpn.innerHTML = `<p class="error-msg" style="display:block;">${err.message}</p>`;
  }
}
</script>
</body>
</html>
