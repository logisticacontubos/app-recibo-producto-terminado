<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario activo — Recibo Producto Terminado</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .inv-item { margin-bottom: 10px; }
  .inv-item .fila { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .inv-item .codigo { font-size: 15px; font-weight: 700; }
  .inv-item .cantidad { font-size: 20px; font-weight: 700; color: var(--magenta); white-space: nowrap; }
  .inv-item .descripcion { font-size: 13px; color: var(--texto); margin: 2px 0 6px; }
  .inv-item .detalle { font-size: 12px; color: var(--gris); }
  .inv-item .fecha { font-size: 12px; color: var(--gris); margin-top: 4px; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a href="home.html" class="back">‹</a>
    <div>
      <h1>Inventario activo</h1>
      <p class="sub">Saldo disponible por ítem</p>
    </div>
  </header>
  <main>
    <input type="text" id="busqueda-input" placeholder="Buscar por código o descripción...">
    <div id="cont-inventario"></div>
  </main>
</div>
<script src="js/app.js"></script>
<script>
const usuario = requiereApp();
let inventarioCompleto = [];

async function cargar() {
  try {
    const res = await apiGet("getInventario", {});
    inventarioCompleto = res.inventario || [];
    render(inventarioCompleto);
  } catch (err) {
    document.getElementById("cont-inventario").innerHTML = `<p class="error-msg" style="display:block;">${err.message}</p>`;
  }
}

function render(lista) {
  const cont = document.getElementById("cont-inventario");
  cont.innerHTML = "";
  if (!lista.length) {
    cont.innerHTML = '<p class="loading">Aún no hay inventario registrado.</p>';
    return;
  }
  lista.forEach(inv => {
    const card = document.createElement("div");
    card.className = "card inv-item";
    const partes = String(inv.Item || "").split(" — ");
    const codigo = partes[0] || "";
    const descripcion = partes.slice(1).join(" — ");
    card.innerHTML = `
      <div class="fila">
        <span class="codigo">${codigo}</span>
        <span class="cantidad">${inv.Cantidad_Disponible_Total}</span>
      </div>
      <p class="descripcion">${descripcion}</p>
      ${inv.Cliente ? `<p class="detalle">Fabricado para: ${inv.Cliente}</p>` : ""}
      <p class="fecha">Entrega más antigua disponible: ${inv.Entrega_Mas_Antigua_Disponible || "—"}</p>`;
    cont.appendChild(card);
  });
}

document.getElementById("busqueda-input").addEventListener("input", (e) => {
  const texto = e.target.value.toUpperCase().trim();
  if (!texto) { render(inventarioCompleto); return; }
  render(inventarioCompleto.filter(inv => String(inv.Item).toUpperCase().includes(texto)));
});

if (usuario) cargar();
</script>
</body>
</html>
